name: Keep scheduled workflows enabled

on:
  workflow_dispatch:
  schedule:
    # Run monthly to keep the repository active and scheduled workflows enabled.
    - cron: '0 0 1 * *'

permissions:
  actions: write
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Enable daily email workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow enable main.yml || true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create keepalive commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled workflows active"
          git push